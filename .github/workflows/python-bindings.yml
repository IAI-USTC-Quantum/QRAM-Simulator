name: Python Bindings

# Guard CI for the pybind11 binding layer: wheel build + install +
# pytest smoke tests. Publishing (tag -> PyPI trusted publishing) is in
# pypi-publish.yml.
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'bindings/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'Common/**'
      - 'QRAM/**'
      - 'ThirdParty/**'
      - '.github/workflows/python-bindings.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'bindings/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'Common/**'
      - 'QRAM/**'
      - 'ThirdParty/**'
      - '.github/workflows/python-bindings.yml'
  workflow_dispatch:

concurrency:
  group: python-bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: wheel + pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Gitea also scans .github/workflows, but its runners cannot reach
    # github.com -> run on the GitHub upstream only
    if: github.repository_owner == 'IAI-USTC-Quantum'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.x'

      # scikit-build-core uses the Ninja generator, which needs cl on PATH
      # (the bare windows runner's pwsh lacks the MSVC environment;
      # otherwise it fails with CMAKE_CXX_COMPILER not set, after
      # EnableLanguage)
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install libgomp (Linux OpenMP runtime)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Build and install wheel
        run: python -m pip install -v . pytest

      - name: Run binding tests
        run: python -m pytest bindings/python/test -v
