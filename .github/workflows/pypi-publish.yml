name: Publish Python Package

# Triggered by a tag (v*) or a GitHub Release -> cibuildwheel builds
# multi-platform wheels + sdist -> PyPI trusted publishing (OIDC, no
# token; the PyPI side needs a trusted publisher preconfigured for
# environment "pypi": owner=IAI-USTC-Quantum, repo=QRAM-Simulator,
# workflow=pypi-publish.yml).
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Gitea also scans .github/workflows, but its runners cannot reach
    # github.com -> run on the GitHub upstream only
    if: github.repository_owner == 'IAI-USTC-Quantum'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs the git history to derive the version
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.x'

      # Windows: inject the MSVC environment into cibuildwheel subprocesses
      # (Ninja needs cl)
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: astral-sh/setup-uv@v5

      - name: Build wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          # musllinux / 32-bit / macOS unsupported for now (see
          # pyproject.toml [tool.cibuildwheel])
          CIBW_SKIP: "*-musllinux_* *-win32 *-macos*"
          # OpenMP runtime (missing by default in manylinux containers)
          CIBW_BEFORE_ALL_LINUX: "yum install -y libgomp"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    if: github.repository_owner == 'IAI-USTC-Quantum'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build setuptools-scm
          python -m build --sdist

      - name: Self-containment check (sdist must carry all sources needed to build)
        run: |
          tar -tzf dist/qram_simulator-*.tar.gz | grep -q "QRAM/include/qram_circuit_qubit.h"
          tar -tzf dist/qram_simulator-*.tar.gz | grep -q "Common/include/basic.h"
          tar -tzf dist/qram_simulator-*.tar.gz | grep -q "ThirdParty/eigen-3.4.0/Eigen/Eigen"
          tar -tzf dist/qram_simulator-*.tar.gz | grep -q "ThirdParty/fmt/src/format.cc"
          tar -tzf dist/qram_simulator-*.tar.gz | grep -q "bindings/python/core_binding.cpp"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Manual workflow_dispatch runs build only, no publishing
    if: >-
      github.repository_owner == 'IAI-USTC-Quantum' &&
      (github.event_name == 'push' || github.event_name == 'release')
    environment:
      name: pypi
      url: https://pypi.org/project/qram-simulator/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
