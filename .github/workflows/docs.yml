name: Documentation

# Sphinx site (bilingual zh/en trees under one site):
#   1. doxygen generates XML (C++ API, ingested by Sphinx via breathe)
#   2. pip install . compiles the pybind11 extension -> pybind11-stubgen
#      generates .pyi stubs (Python API, built via sphinx-autoapi)
#   3. sphinx-build builds BOTH language trees (html/zh + html/en) plus a
#      root redirect page (English by default) and deploys to gh-pages
#      (full replacement on push to main)
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - '**.md'
      - '**.rst'
      - 'LICENSE'
      - 'docs/**'
      - 'Doxyfile'
      - 'bindings/**'
      - 'pyproject.toml'
      - 'Common/**'
      - 'QRAM/**'
      - '.pre-commit-config.yaml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - '**.md'
      - '**.rst'
      - 'LICENSE'
      - 'docs/**'
      - 'Doxyfile'
      - 'bindings/**'
      - 'pyproject.toml'
      - 'Common/**'
      - 'QRAM/**'
      - '.pre-commit-config.yaml'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    # Gitea also scans .github/workflows, but its runners cannot reach
    # github.com -> run on the GitHub upstream only
    if: github.repository_owner == 'IAI-USTC-Quantum'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.26.x'

    - name: Install Documentation Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y doxygen graphviz libgomp1

    - name: Generate Doxygen XML (C++ API for breathe)
      run: doxygen Doxyfile

    - name: Build Python extension and type stubs (Python API for autoapi)
      run: |
        python -m pip install -v . pybind11-stubgen -r docs/sphinx/requirements.txt
        python -m pybind11_stubgen qram_simulator -o docs/sphinx/source/api_stubs

    - name: Build Sphinx site (zh + en trees)
      run: |
        sphinx-build docs/sphinx/source/zh docs/sphinx/build/html/zh
        sphinx-build docs/sphinx/source/en docs/sphinx/build/html/en

    - name: Generate root landing page (redirect, English by default)
      run: |
        printf '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<title>QRAM-Simulator Documentation</title>\n<meta http-equiv="refresh" content="0; url=en/index.html">\n<link rel="canonical" href="en/index.html">\n</head>\n<body>\n<p>Redirecting to the <a href="en/index.html">English documentation</a>. <a href="zh/index.html">中文文档</a></p>\n</body>\n</html>\n' > docs/sphinx/build/html/index.html

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          docs/sphinx/build/html/
        retention-days: 30

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/sphinx/build/html/
        publish_branch: gh-pages
        # Bilingual Sphinx site: fully replaces the old landing page /
        # Doxygen site previously hosted on gh-pages
        force_orphan: true
