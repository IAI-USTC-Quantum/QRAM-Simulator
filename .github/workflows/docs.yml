name: Documentation

# Build docs only on documentation changes
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - 'Doxyfile'
      - '.pre-commit-config.yaml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - 'Doxyfile'
      - '.pre-commit-config.yaml'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    # Gitea 也会扫描 .github/workflows,但其 runner 访问不了 github.com → 仅 GitHub 上游执行
    if: github.repository_owner == 'IAI-USTC-Quantum'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Install Documentation Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y doxygen graphviz

    - name: Generate Doxygen Documentation
      run: doxygen Doxyfile

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          docs/api/html/
        retention-days: 30

    - name: Prepare Pages directory
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        mkdir -p pages-deploy

        # Landing page
        cp docs/index.html pages-deploy/index.html

        # Doxygen docs (C++ API)
        mkdir -p pages-deploy/api
        cp -r docs/api/html/* pages-deploy/api/

        # Other docs
        cp docs/architecture.md pages-deploy/
        cp docs/operators.md pages-deploy/
        cp docs/README.md pages-deploy/

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: pages-deploy/
        publish_branch: gh-pages
