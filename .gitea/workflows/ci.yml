name: QRAM Simulator CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: qram-simulator-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU C++ and Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgomp1 python3-dev

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pybind11 pytest

      - name: Configure C++ tests
        run: |
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCACHED_REGISTER_SIZE=8 \
            -DBUILD_EXAMPLES=OFF

      - name: Build C++ tests
        run: cmake --build build/ci --parallel 2

      - name: Run C++ tests
        run: ctest --test-dir build/ci --output-on-failure --parallel 2

      - name: Build and install PySparQ
        env:
          CMAKE_ARGS: >-
            -DCACHED_REGISTER_SIZE=8
            -DBUILD_EXAMPLES=OFF
        run: python -m pip install .

      - name: Run Python tests
        run: python -m pytest -q PySparQ/test
