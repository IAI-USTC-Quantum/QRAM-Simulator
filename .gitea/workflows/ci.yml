name: QRAM Simulator CI

on:
  push:
    branches: [main, develop, "autopilot/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: qram-simulator-ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU C++ tests
    runs-on: ubuntu-latest

    steps:
      # Self-contained steps: the runner cannot reliably reach github.com
      # (TLS handshake timeouts), so actions/checkout and
      # actions/setup-python are avoided in favor of cloning directly from
      # this Gitea instance + using the system toolchain.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git libgomp1

      - name: Check out repository
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git clone "https://${GITHUB_ACTOR}:${TOKEN}@${GITHUB_SERVER_URL#*//}/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "$GITHUB_SHA"

      - name: Configure C++ tests
        run: |
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCACHED_REGISTER_SIZE=8

      - name: Build C++ tests
        run: cmake --build build/ci --parallel 2

      - name: Run C++ tests
        run: ctest --test-dir build/ci --output-on-failure --parallel 2

  # SparQSim consumes this repository via add_subdirectory(submodule);
  # this job verifies that the consumer-mode option combination is
  # configurable and the core libraries compile.
  consumer-mode:
    name: Consumer mode (embedded build)
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgomp1

      - name: Check out repository
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git clone "https://${GITHUB_ACTOR}:${TOKEN}@${GITHUB_SERVER_URL#*//}/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "$GITHUB_SHA"

      - name: Configure in consumer mode
        run: |
          cmake -S . -B build/consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DQRAM_BUILD_TESTS=OFF \
            -DQRAM_BUILD_EXPERIMENTS=OFF

      - name: Build core libraries
        run: cmake --build build/consumer --target SparQ_QRAMSimulator --parallel 2
