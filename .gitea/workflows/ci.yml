name: QRAM Simulator CI

on:
  push:
    branches: [main, develop, "autopilot/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: qram-simulator-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU C++ and Python
    runs-on: ubuntu-latest

    steps:
      # 自包含步骤：runner 无法稳定访问 github.com（TLS 握手超时），
      # 因此不用 actions/checkout 与 actions/setup-python，
      # 改为直接从本 Gitea 实例克隆 + 使用系统 Python。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git libgomp1 python3-dev python3-pip python3-venv python-is-python3

      - name: Check out repository
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git clone "https://${GITHUB_ACTOR}:${TOKEN}@${GITHUB_SERVER_URL#*//}/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "$GITHUB_SHA"

      - name: Install Python build dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "PATH=$RUNNER_TEMP/venv/bin:$PATH" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install numpy pybind11 pytest

      - name: Configure C++ tests
        run: |
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCACHED_REGISTER_SIZE=8 \
            -DBUILD_EXAMPLES=OFF

      - name: Build C++ tests
        run: cmake --build build/ci --parallel 2

      - name: Run C++ tests
        run: ctest --test-dir build/ci --output-on-failure --parallel 2

      - name: Build and install PySparQ
        env:
          CMAKE_ARGS: >-
            -DCACHED_REGISTER_SIZE=8
            -DBUILD_EXAMPLES=OFF
        run: python -m pip install .

      - name: Run Python tests
        run: python -m pytest -q PySparQ/test
