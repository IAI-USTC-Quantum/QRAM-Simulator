[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
    "setuptools-scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "qram-simulator"
dynamic = ["version"]
description = "Sparse-state quantum circuit simulator core with native QRAM support (thin Python bindings)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Agony", email = "chenzhaoyun@iai.ustc.edu.cn" }]

dependencies = []

[project.urls]
Homepage = "https://github.com/IAI-USTC-Quantum/QRAM-Simulator"

[project.optional-dependencies]
dev = ["pybind11-stubgen", "pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.platlib = true
# wheel.packages is required WITH wheel.platlib to include Python source
# files from bindings/python/qram_simulator/ in the wheel alongside the
# compiled extension from the CMake install prefix (platlib).
wheel.packages = {qram_simulator = "bindings/python/qram_simulator"}
ninja.make-fallback = false
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build.cmake.define]
# Wheel builds never need the C++ test/experiment/example targets; the
# vendored googletest is therefore skipped as well.
QRAM_BUILD_TESTS = false
QRAM_BUILD_EXPERIMENTS = false
QRAM_BUILD_PYTHON_BINDINGS = true
BUILD_EXAMPLES = false

[tool.scikit-build.sdist]
# Keep the sdist self-contained but free of test-only bulk. Turning
# QRAM_BUILD_TESTS back ON inside an sdist requires googletest, which is
# excluded here.
exclude = [
    "/Experiments",
    "/test",
    "/SparQ/test",
    "/examples",
    "/docs",
    "/ThirdParty/googletest",
    "/.gitea",
    "/.github",
    "/.pre-commit-config.yaml",
    "/.clang-format",
    "/.gitattributes",
    "/Doxyfile",
    "/CMakeSettings.json",
]

# __version__ is read from dist-info at runtime (importlib.metadata) — no
# generated _version.py needed (scikit-build-core excludes gitignored files
# from wheels, which silently dropped the written file).
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.cibuildwheel]
build-frontend = "build[uv]"
# 暂不支持 32 位系统(size_t != uint64_t)
# 暂时移除 macOS 支持
skip = ["*-musllinux_*", "*-win32", "*-macos*"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "yum install -y libgomp"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
