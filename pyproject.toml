[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
    "setuptools-scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "qram-simulator"
dynamic = ["version"]
description = "QRAM circuit simulation core: noisy sparse branch-based simulation for qubit/qutrit architectures (thin pybind11 bindings)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Agony", email = "chenzhaoyun@iai.ustc.edu.cn" }]

dependencies = []

[project.urls]
Homepage = "https://github.com/IAI-USTC-Quantum/QRAM-Simulator"
Documentation = "https://iai-ustc-quantum.github.io/QRAM-Simulator/"

[project.optional-dependencies]
dev = ["pybind11-stubgen", "pytest"]
# circuit-level baseline simulator (qram_simulator.baseline) and its packaged
# comparison experiment: the uniqc (UnifiedQuantum) QuTiP density-matrix backend
baseline = ["numpy", "unified-quantum", "qutip", "qutip-qip"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.platlib = true
# wheel.packages must be enabled together with wheel.platlib: packs both the
# pure-Python sources of bindings/python/qram_simulator and the compiled
# extension (_core) from the CMake install prefix into the wheel
wheel.packages = { qram_simulator = "bindings/python/qram_simulator" }
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build.cmake.define]
# Wheel builds don't need the C++ test/experiment targets; the vendored
# googletest is skipped as well
QRAM_BUILD_TESTS = false
QRAM_BUILD_EXPERIMENTS = false
QRAM_BUILD_PYTHON_BINDINGS = true

[tool.scikit-build.sdist]
# Keep the sdist self-contained (eigen/fmt/argparse ship with the package,
# no network access needed at build time) while trimming test and docs
# redundancy; Python tests live in bindings/python/test (kept)
exclude = [
    "/Experiments",
    "/test",
    "/docs",
    "/ThirdParty/googletest",
    "/.gitea",
    "/.github",
    "/.pre-commit-config.yaml",
    "/.clang-format",
    "/.gitattributes",
    "/Doxyfile",
    "/CMakeSettings.json",
]

# __version__ is read from dist-info at runtime (see
# bindings/python/qram_simulator/__init__.py) instead of writing _version.py
# to disk: scikit-build-core filters wheel contents by .gitignore and once
# silently dropped the version file written by setuptools-scm
# (a pitfall hit by pyqsparse<=0.1.1)
[tool.setuptools-scm]
fallback_version = "0.0.0"

[tool.cibuildwheel]
build-frontend = "build[uv]"
# 32-bit systems unsupported for now (size_t != uint64_t); macOS support deferred
skip = ["*-musllinux_*", "*-win32", "*-macos*"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "yum install -y libgomp" # OpenMP runtime

[tool.cibuildwheel.windows]
archs = ["AMD64"]
