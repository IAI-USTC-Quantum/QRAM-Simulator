<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRAM-Simulator · 噪声实验室</title>
<style>
:root{font-family:system-ui,sans-serif;color:#163347;background:#f3f7fa}body{margin:0}header{background:#133648;color:white;padding:28px max(6vw,24px)}header small{color:#8edfd1}h1{margin:8px 0;font-size:30px}main{max-width:1080px;margin:28px auto;padding:0 24px}.grid{display:grid;grid-template-columns:300px 1fr;gap:24px}.card{background:white;border:1px solid #dce7ec;border-radius:14px;padding:24px}label{display:block;margin:14px 0 5px}input,select,button{font:inherit;padding:9px;border:1px solid #bfd0da;border-radius:6px;box-sizing:border-box;width:100%}button{background:#076b66;color:white;border:0;margin-top:22px;cursor:pointer}button:disabled{opacity:.5}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.value{font-size:23px;display:block;color:#076b66;overflow-wrap:anywhere}.muted{color:#55717f;font-size:13px}svg{width:100%;height:190px;background:#f5f9fb;border-radius:8px;margin-top:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#status{min-height:22px}a{color:#076b66}@media(max-width:760px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}}
</style>
<header><small>QUANTUM MEMORY / LOCAL CPU</small><h1>QRAM-Simulator · 噪声实验室</h1><div id="version">正在读取软件版本</div></header>
<main><div class="grid"><form class="card" id="config"><h2>配置实验</h2>
<label for="depth">QRAM 层数</label><input id="depth" type="number" min="1" max="12" value="3" required>
<label for="data_bits">数据位宽</label><input id="data_bits" type="number" min="1" max="2" value="1" required>
<label for="inputs">叠加输入地址数</label><input id="inputs" type="number" min="1" max="32" value="8" required>
<label for="trajectories">独立噪声轨迹数</label><input id="trajectories" type="number" min="1" max="64" value="32" required>
<label for="channel">噪声信道</label><select id="channel"><option value="Depolarizing">退极化</option><option value="BitFlip">比特翻转</option><option value="PhaseFlip">相位翻转</option><option value="Damping">振幅阻尼</option><option value="none">无噪声</option></select>
<label for="probability">每次信道作用的概率</label><input id="probability" type="number" min="0" max="0.1" step="any" value="0.001" required>
<label for="seed">随机种子</label><input id="seed" type="number" min="0" max="4294967295" value="20261109" required>
<button id="run" type="submit">运行 QRAM 仿真</button><p class="muted">随机数据表与输入固定，逐条采样噪声轨迹。当前界面运行本机 CPU。</p></form>
<section class="card"><h2>信道结果</h2><p id="status" role="status" aria-live="polite">设置参数后运行实验。</p><div class="metrics"><div><span class="muted">平均无条件保真度</span><strong class="value" id="mean">—</strong></div><div><span class="muted">数据记录数</span><strong class="value" id="records">—</strong></div><div><span class="muted">总耗时 / 秒</span><strong class="value" id="elapsed">—</strong></div></div>
<svg id="plot" viewBox="0 0 640 190" role="img" aria-label="各轨迹保真度，纵轴零至一"><text x="20" y="25" fill="#55717f">各轨迹保真度 · 0 至 1</text></svg>
<p id="interval" class="muted"></p><p class="muted">保真度在路由树测量前计算，包含残留树激发的影响。区间表示 Monte Carlo 采样不确定性。此实验不构成硬件或项目指标验收结论。</p><button type="button" id="download" disabled>下载实验 JSON</button><details><summary>数据来源与资源明细</summary><pre id="detail">尚无结果</pre></details></section></div></main>
<script nonce="__SESSION_TOKEN__">
const token='__SESSION_TOKEN__';let latest=null;const el=id=>document.getElementById(id);
fetch('/api/info').then(r=>r.json()).then(x=>el('version').textContent=`版本 ${x.version} · ${x.backend}`).catch(()=>el('version').textContent='无法读取版本');
el('channel').addEventListener('change',()=>{if(el('channel').value==='none')el('probability').value='0'});
el('config').addEventListener('submit',async e=>{e.preventDefault();const args={};for(const id of ['depth','data_bits','inputs','trajectories','seed','probability'])args[id]=Number(el(id).value);args.channel=el('channel').value;el('run').disabled=true;el('download').disabled=true;el('status').textContent='正在演化独立噪声轨迹…';try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-Session':token},body:JSON.stringify(args)});const x=await r.json();if(!r.ok)throw new Error(x.error);latest=x;el('mean').textContent=x.fidelity.mean.toFixed(6);el('records').textContent=x.memory.records.toLocaleString();el('elapsed').textContent=x.timing_s.total.toFixed(4);el('interval').textContent=`95% Hoeffding 区间：[${x.fidelity.confidence.interval.map(v=>v.toFixed(4)).join(', ')}]`;const svg=el('plot');svg.replaceChildren();const pts=x.fidelity.samples.map((v,i)=>`${20+600*i/Math.max(1,x.fidelity.samples.length-1)},${170-140*v}`).join(' ');const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');for(const[k,v]of Object.entries({points:pts,fill:'none',stroke:'#076b66','stroke-width':'2'}))line.setAttribute(k,v);svg.append(line);el('detail').textContent=JSON.stringify({software:x.software,configuration:x.configuration,memory:x.memory,resources:x.resources,normalization:x.normalization,scope:x.scope},null,2);el('status').textContent=`已完成 ${x.configuration.trajectories} 条轨迹；归一化最大误差 ${x.normalization.max_trace_error.toExponential(2)}`;el('download').disabled=false}catch(err){el('status').textContent=err.message}finally{el('run').disabled=false}});
el('download').addEventListener('click',()=>{if(!latest)return;const u=URL.createObjectURL(new Blob([JSON.stringify(latest,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='qram-experiment.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
</script></html>
